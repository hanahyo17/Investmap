<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1c2320" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="현장조사"><title>현장조사 노트</title>
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<style>
/* Layout: full-height field app. Top bar, map/list stage with a bottom sheet for the selected place, bottom tab bar.
   Palette: survey-flag orange as the single accent over green-tinted neutrals; slate for unvisited points, green for recorded. */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --surface2:#e8ebe4; --ink:#1b221d; --muted:#5a655d; --line:#d6dbd2;
  --accent:#d1431a; --accent-ink:#ffffff; --accent-soft:#fbe5dc;
  --ok:#2b7a4b; --mark:#4f6b82; --warn:#9a5b00; --danger:#b3261e; --gps:#2b6fe0;
  --canvas:#e6e8e1;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131815; --surface:#1c2320; --surface2:#27302b; --ink:#e8eee9; --muted:#9aa69d; --line:#333d36;
  --accent:#ff7d52; --accent-ink:#1a0d07; --accent-soft:#3a2219;
  --ok:#5cc489; --mark:#8eaac0; --warn:#e0a13c; --danger:#ff8a80; --gps:#6ea2ff; --canvas:#1a201d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131815; --surface:#1c2320; --surface2:#27302b; --ink:#e8eee9; --muted:#9aa69d; --line:#333d36;
  --accent:#ff7d52; --accent-ink:#1a0d07; --accent-soft:#3a2219;
  --ok:#5cc489; --mark:#8eaac0; --warn:#e0a13c; --danger:#ff8a80; --gps:#6ea2ff; --canvas:#1a201d; color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-text-size-adjust:100%;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.ttl p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;vertical-align:1px}

.stage{flex:1;position:relative;min-height:0}
#mapView,#listView{position:absolute;inset:0}
#map{display:block;width:100%;height:100%;touch-action:none;background:var(--canvas)}
.ctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:grid;grid-template-columns:48px 48px;gap:4px;z-index:3}
.ctl button{width:48px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.18);font-size:12px;font-weight:700;padding:0}
.ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ctl button.big{font-size:22px;line-height:1;font-weight:500}
#tileNote,#cadNote{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;max-width:calc(100% - 150px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--muted);z-index:3}
#tileNote[hidden]{display:none}
#cadNote{top:58px}
#cadNote button{margin-left:6px}
#vol{background:var(--accent-soft);color:var(--ink);font-size:13px;padding:6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}

#listView{display:flex;flex-direction:column;background:var(--bg)}
.search{padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface)}
#list{list-style:none;margin:0;padding:0 0 12px;overflow:auto;flex:1;min-height:0}
#list li button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:60px}
#list .no{grid-row:1/3;font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:34px}
#list b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:2}
#list .st{grid-column:3;grid-row:1;font-size:12px;color:var(--muted);text-align:right}
#list .st.on{color:var(--ok);font-weight:700}
#list .dist{grid-column:3;grid-row:2;font-size:12px;color:var(--muted);text-align:right;font-family:var(--mono)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{min-height:52px;border:0;background:transparent;font-weight:700;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}

#sheet{position:absolute;left:0;right:0;bottom:0;max-height:60%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.22);padding:0 max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));z-index:5;overscroll-behavior:contain}
.grab{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:6px 0 2px;z-index:2}
.grab i{display:block;width:36px;height:4px;border-radius:4px;background:var(--line);margin-left:calc(50% - 18px);position:absolute;left:0;top:8px}
.grab button{min-height:36px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:0 4px}
.grab .x{margin-left:auto}
.sh-no{font:500 12px var(--mono);color:var(--muted)}
#sheet h2{margin:0 0 2px;font-size:20px;line-height:1.3;letter-spacing:-.01em}
.addr{margin:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.addr span{flex:1;min-width:0;overflow-wrap:anywhere}
.coord{margin:4px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.nav-h{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.nav-h a{color:var(--muted)}
#sheet.min .sh-body{display:none}
.sh-body section{margin-top:18px}
.sh-body h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.sh-body h3 .cnt{font:500 12px var(--mono);color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--surface2);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;font-weight:700;font-size:13px}
.thumb.add svg{width:24px;height:24px}
.sub-act{margin-top:8px}
textarea#memo{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;line-height:1.5}
.saved{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px}

#info{position:absolute;left:0;right:0;bottom:0;max-height:44%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.22);padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:5;overscroll-behavior:contain}
#info .ih{display:flex;align-items:center;justify-content:space-between;gap:8px}
#info h3{margin:0;font-size:15px}
#info .lay{font-size:12px;color:var(--muted)}
#info table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
#info td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top;overflow-wrap:anywhere}
#info td:first-child{color:var(--muted);width:34%}
.laylist{list-style:none;margin:8px 0;padding:0}
.laylist li{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--line)}
.laylist label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.laylist input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.laylist input[type=color]{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface);flex:none}
.laylist small{color:var(--muted)}
.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.55);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
#modal[hidden]{display:none}
.dlg{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){#modal{align-items:center}.dlg{border-radius:14px}}
.dlg h2{margin:0 0 6px;font-size:18px}
.dlg p{margin:6px 0}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-size:13px;font-weight:700}
.field select,.field input{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;width:100%}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
.warn{color:var(--warn);font-size:13px}
.err{color:var(--danger);font-size:13px}
.ok-t{color:var(--ok);font-size:13px}
.pv{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.pv td,.pv th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;overflow-wrap:anywhere}
.pv-wrap{overflow-x:auto}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.stats{display:flex;gap:16px;margin:8px 0;font-size:13px;color:var(--muted)}
.stats b{display:block;font:500 20px var(--mono);color:var(--ink)}

.viewer{background:#0b0f0d;width:100%;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.viewer .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.vbar{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:#0b0f0d}
.vbar .btn{flex:1;background:#1f2723;color:#eef3ef;border-color:#33403a}
.vbar .btn.danger{color:#ff8a80;border-color:#ff8a80;background:transparent}

.draw{background:var(--surface);width:100%;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dbar{display:flex;align-items:center;justify-content:space-between;padding:6px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.dstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--surface2);overflow:hidden}
#dcv{background:#fff;touch-action:none;box-shadow:0 1px 8px rgba(0,0,0,.25)}
.dtools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.wd{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.wd i{display:block;background:var(--ink);border-radius:50%}
.grp{display:flex;gap:8px;align-items:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#202823;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;max-width:min(92%,460px);text-align:center;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <header class="top">
    <div class="ttl"><h1>현장조사 노트</h1><p id="sub"></p></div>
    <div class="acts">
      <button class="btn sm" data-act="openImport" id="btnImport">조사점 불러오기</button>
      <button class="btn sm pri" data-act="openExport" id="btnExport">내보내기</button>
    </div>
  </header>
  <div id="vol" hidden>이 브라우저에서는 기록을 저장할 수 없어, 화면을 닫으면 사라집니다. 지금 ZIP으로 내보내 주세요.</div>
  <div class="stage">
    <section id="mapView">
      <canvas id="map" aria-label="지도"></canvas>
      <div class="ctl">
        <button class="big" data-act="zin" aria-label="확대">+</button>
        <button class="big" data-act="zout" aria-label="축소">−</button>
        <button data-act="fit" aria-label="전체 보기">전체</button>
        <button data-act="locate" aria-label="내 위치">내 위치</button>
        <button data-act="layers" id="btnLay" aria-label="참고 레이어">레이어</button>
        <button data-act="cad" id="btnCad" aria-pressed="false" aria-label="연속지적도 켜기/끄기">지적</button>
        <button data-act="basemap" id="btnBase" aria-label="배경지도 바꾸기">위성</button>
      </div>
      <div id="tileNote" hidden>배경지도를 불러오지 못해 점 위치만 표시합니다.</div>
      <div id="cadNote" hidden>지적도를 불러오지 못했습니다. 인증키와 서비스 URL 등록을 확인하세요.<button class="btn sm" data-act="openKey">키 설정</button></div>
    </section>
    <section id="listView" hidden>
      <div class="search"><input id="q" type="search" placeholder="장소명·주소 검색" autocomplete="off"></div>
      <ul id="list"></ul>
    </section>
    <aside id="sheet" hidden></aside>
    <aside id="info" hidden></aside>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-act="tab" data-tab="map" aria-selected="true">지도</button>
    <button role="tab" data-act="tab" data-tab="list" aria-selected="false">목록</button>
  </nav>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="shpIn" multiple hidden>
<input type="file" id="layIn" multiple hidden>

async function gatherFiles(fileList){

      if(typeof JSZip==='undefined')throw new Error('ZIP 처리 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 shp·dbf·prj를 함께 선택하세요');
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      z.forEach((path,en)=>{if(!en.dir&&!/(^|\/)(__MACOSX|\._)/.test(path))ents.push({name:path.split('/').pop(),get:()=>en.async('arraybuffer')})})
    }else ents.push({name:f.name,get:()=>f.arrayBuffer()})}

  const shpE=ents.find(e=>ext(e,'shp'));if(!shpE)throw new Error('.shp 파일을 찾지 못했습니다');

const idb=(()=>{
  let p=null;

    const r=indexedDB.open('field-note',2);
    r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);
      if(!has('kv'))d.createObjectStore('kv');if(!has('rec'))d.createObjectStore('rec',{keyPath:'pid'});
      if(!has('media'))d.createObjectStore('media',{keyPath:'id'});if(!has('layers'))d.createObjectStore('layers',{keyPath:'id'})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}}));
  const wrap=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  const tx=async(s,m,fn)=>{const d=await open();return wrap(fn(d.transaction(s,m).objectStore(s)))};

function stats(){
  const L=S.layer;if(!L)return {n:0,done:0};

function hav(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function renderList(){
  const ul=$('#list'),L=S.layer;if(!L){ul.innerHTML='<li class="empty">불러온 shp가 없습니다.</li>';return}

async function shrink(file,max=2048,q=.85){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();
  return new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',q))}
async function addMedia(pid,kind,blob){
  const m={id:uid(),pid,kind,blob,ts:Date.now()};
  if(!S.media.has(pid))S.media.set(pid,[]);S.media.get(pid).push(m);
  await persist(()=>idb.put('media',m));
  if(S.sel===pid)renderMedia();refreshAll();return m}

  if(ok)toast(ok+'장 저장했습니다')}

function fitDraw(){
  if(!DR)return;const st=$('#dstage'),cvd=$('#dcv');if(!st||!cvd)return;
  const s=Math.min((st.clientWidth-16)/DR.W,(st.clientHeight-16)/DR.H);cvd.style.width=Math.floor(DR.W*s)+'px';cvd.style.height=Math.floor(DR.H*s)+'px'}
window.addEventListener('resize',()=>{fitDraw();resize()});
function pw(){return [4,9,18][DR.wi-1]*(DR.W/1200)}
function dStroke(c,s,from){
  c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.w;c.lineCap='round';c.lineJoin='round';
  if(s.pts.length===1){c.beginPath();c.arc(s.pts[0][0],s.pts[0][1],s.w/2,0,7);c.fill();return}
  c.beginPath();c.moveTo(...s.pts[from||0]);for(let i=(from||0)+1;i<s.pts.length;i++)c.lineTo(...s.pts[i]);c.stroke()}
function dRedraw(){
  const cvd=$('#dcv');if(!cvd||!DR)return;const c=cvd.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,DR.W,DR.H);if(DR.bmp)c.drawImage(DR.bmp,0,0,DR.W,DR.H);
  DR.strokes.forEach(s=>dStroke(c,s))}
function bindDraw(){
  const cvd=$('#dcv');
  const pos=e=>{const r=cvd.getBoundingClientRect();return [(e.clientX-r.left)*DR.W/r.width,(e.clientY-r.top)*DR.H/r.height]};
  cvd.addEventListener('pointerdown',e=>{if(!DR)return;e.preventDefault();cvd.setPointerCapture(e.pointerId);DR.cur={color:DR.color,w:pw(),pts:[pos(e)]};DR.strokes.push(DR.cur);dStroke(cvd.getContext('2d'),DR.cur)});
  cvd.addEventListener('pointermove',e=>{if(!DR||!DR.cur)return;const s=DR.cur,n=s.pts.length;s.pts.push(pos(e));dStroke(cvd.getContext('2d'),s,Math.max(0,n-1))});
  const up=()=>{if(DR)DR.cur=null};cvd.addEventListener('pointerup',up);cvd.addEventListener('pointercancel',up)}
async function dSave(){

    const [lng,lat]=toLngLat(pt[0],pt[1],epsg);if(!isFinite(lng)||!isFinite(lat))return;
    const at=row||{};
    out.push({i,name:(I.nameF&&at[I.nameF])||'지점 '+(i+1),addr:I.addrF?(at[I.addrF]||''):'',x:pt[0],y:pt[1],lng,lat,attrs:at})});
  return out}

const LCOL=['#e5251b','#1d5fe0','#8a3ffc','#00897b','#f57c00','#c2185b'];
function parseLines(buf){
  const dv=new DataView(buf),len=buf.byteLength;
  if(len<100||dv.getInt32(0,false)!==9994)throw new Error('올바른 .shp 파일이 아닙니다');
  const type=dv.getInt32(32,true);
  if(![3,13,23,5,15,25].includes(type))throw new Error([1,11,21,8,18,28].includes(type)?'점 shp입니다. 점은 위쪽의 "조사점 불러오기"로 불러오세요.':'지원하지 않는 shp 형식입니다. 선 또는 면 shp만 가능합니다.');
  let p=100,nF=0,P=0,N=0;const recs=[];
  while(p+8<=len){const cl=dv.getInt32(p+4,false)*2,s=p+8;if(cl<4||s+cl>len)break;
    const t=dv.getInt32(s,true);
    if(t===0||cl<44)recs.push(null);else{const np=dv.getInt32(s+36,true),pt=dv.getInt32(s+40,true);recs.push([s,np,pt]);P+=np;N+=pt}
    nF++;p=s+cl}

  const fp=new Int32Array(nF+1),ps=new Int32Array(P+1),raw=new Float64Array(2*N);let pi=0,ni=0;
  recs.forEach((r,i)=>{fp[i]=pi;if(r){const [s,np,pt]=r,po=s+44,xo=po+4*np;
    for(let k=0;k<np;k++)ps[pi+k]=ni+dv.getInt32(po+4*k,true);
    for(let k=0;k<pt;k++){raw[2*(ni+k)]=dv.getFloat64(xo+16*k,true);raw[2*(ni+k)+1]=dv.getFloat64(xo+16*k+8,true)}

    const a=ps[fp[i]],b=ps[fp[i+1]];if((rows&&rows[i]===null)||b<=a)continue;

      const sn=Math.sin(lat*R),wx=(lng+180)/360,wy=.5-Math.log((1+sn)/(1-sn))/(4*Math.PI);

  return {xy,fb,alive}}
function drawLayers(c){
  if(!S.layers.length)return;
  const w=M.w,h=M.h,z=SC(),minx=M.cx-w/2/z,maxx=M.cx+w/2/z,miny=M.cy-h/2/z,maxy=M.cy+h/2/z;
  c.lineJoin='round';c.lineCap='round';let skipped=null;
  for(const L of S.layers){
    if(!L.visible)continue;

    for(let i=0;i<L.nF;i++){if(!L.alive[i])continue;const b=4*i;if(fb[b+2]<minx||fb[b]>maxx||fb[b+3]<miny||fb[b+1]>maxy)continue;vis.push(i)}
    if(vis.length>40000&&M.z<14){skipped=L.name;continue}
    const trace=idx=>{for(const i of idx){
      for(let q=L.fp[i];q<L.fp[i+1];q++){
        const a=L.ps[q],b=L.ps[q+1];let lx=(L.xy[2*a]-M.cx)*z+w/2,ly=(L.xy[2*a+1]-M.cy)*z+h/2;c.moveTo(lx,ly);

function pickLine(px,py){
  const z=SC(),tol=18/z,wx=M.cx+(px-M.w/2)/z,wy=M.cy+(py-M.h/2)/z;let best=null,bd=18;

      for(let q=L.fp[i];q<L.fp[i+1];q++){
        for(let k=L.ps[q];k<L.ps[q+1]-1;k++){
          const ax=(L.xy[2*k]-M.cx)*z+M.w/2,ay=(L.xy[2*k+1]-M.cy)*z+M.h/2,bx=(L.xy[2*k+2]-M.cx)*z+M.w/2,by=(L.xy[2*k+3]-M.cy)*z+M.h/2;

  openModal(`<div class="dlg"><h2>지적도 인증키</h2>
  <p class="muted">브이월드(vworld.kr)에서 발급받은 인증키를 붙여 넣으세요. 키는 이 폰의 브라우저에만 저장됩니다.</p>
  <div class="field"><label for="keyIn">인증키</label><input id="keyIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.vkey)}" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"></div>
  <p class="muted" style="font-size:12.5px">키를 신청할 때 등록한 서비스 URL이 이 앱의 주소와 맞아야 합니다. 이 앱의 주소: <b class="mono">${esc(location.origin)}</b></p>
  <div class="row"><button class="btn" data-act="close">닫기</button><button class="btn ok" data-act="keySave">저장하고 켜기</button></div>
  ${S.vkey?'<div class="row"><button class="btn danger" data-act="keyClear">키 삭제</button></div>':''}</div>`)}

/* ================= 내 위치 ================= */
function locate(){
  if(!navigator.geolocation){toast('이 기기에서는 위치를 쓸 수 없습니다');return}
  const ok=p=>{S.loc={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||30};requestDraw();if(S.tab==='list')renderList()};
  navigator.geolocation.getCurrentPosition(p=>{
    ok(p);const wx=(S.loc.lng+180)/360,s=Math.sin(S.loc.lat*Math.PI/180);M.cx=wx;M.cy=0.5-Math.log((1+s)/(1-s))/(4*Math.PI);M.z=Math.max(M.z,16);requestDraw();
    if(!S.watch)S.watch=navigator.geolocation.watchPosition(ok,()=>{},{enableHighAccuracy:true,maximumAge:5000})},
    ()=>toast('위치를 가져오지 못했습니다. 위치 권한을 허용했는지 확인하세요. 미리보기 화면에서는 막혀 있을 수 있습니다.',4200),
    {enableHighAccuracy:true,timeout:12000})}

/* ================= 클릭 처리 ================= */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
    case 'tab':setTab(b.dataset.tab);break;
    case 'zin':zoomAt(M.w/2,M.h/2,M.z+1);break;
    case 'zout':zoomAt(M.w/2,M.h/2,M.z-1);break;
    case 'fit':fit();break;
    case 'locate':locate();break;
    case 'layers':openLayers();break;
    case 'pickLay':$('#layIn').click();break;
    case 'layGo':layGo(b);break;
    case 'layZoom':{const L=S.layers.find(l=>l.id===b.dataset.id);if(L){const bx=layerBox(L);closeModal();zoomToBox(bx);toast('레이어 위치로 이동했습니다. 필지가 안 보이면 더 확대하세요',2400)}break}
    case 'layDel':{if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='삭제 확인';setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent='삭제'}},3500);break}
      const id=b.dataset.id;S.layers=S.layers.filter(l=>l.id!==id);if(S.pick&&S.pick.lid===id)hideInfo();persist(()=>idb.del('layers',id));renderLayList();requestDraw();break}
    case 'infoClose':hideInfo();requestDraw();break;
    case 'cad':if(!S.vkey){openKey();break}S.cad=!S.cad;syncCad();toast(S.cad?'지적도를 켰습니다. 지도를 확대하면 필지 경계가 보입니다':'지적도를 껐습니다');break;
    case 'openKey':openKey();break;
    case 'keySave':{const v=($('#keyIn').value||'').trim();if(!v){toast('인증키를 입력하세요');break}
      S.vkey=v;S.cad=true;resetCad();try{localStorage.setItem('fn_vkey',v)}catch(err){}closeModal();syncCad();toast('지적도를 켰습니다. 지도를 확대하면 필지 경계가 보입니다');break}
    case 'keyClear':S.vkey='';S.cad=false;resetCad();try{localStorage.removeItem('fn_vkey')}catch(err){}closeModal();syncCad();toast('인증키를 삭제했습니다');break;
    case 'basemap':S.base=S.base==='osm'?'sat':'osm';b.textContent=S.base==='osm'?'위성':'지도';requestDraw();break;
    case 'pick':setTab('map');select(+b.dataset.i,true);break;
    case 'deselect':deselect();break;
    case 'sheetMin':{const sh=$('#sheet');sh.classList.toggle('min');b.textContent=sh.classList.contains('min')?'펼치기':'접기';break}
    case 'copyAddr':{const f=featureOf(S.sel);try{await navigator.clipboard.writeText(f.addr);toast('주소를 복사했습니다')}catch(err){toast('복사하지 못했습니다. 주소를 길게 눌러 복사하세요')}break}
    case 'shoot':if(S.sel!=null)$('#camIn').click();break;
    case 'gallery':if(S.sel!=null)$('#galIn').click();break;
    case 'drawNew':if(S.sel!=null){saveMemoNow();openDraw(S.sel,null)}break;
    case 'view':openViewer(b.dataset.id);break;
    case 'vDraw':{const m=VW&&findMedia(VW.id);if(m){const pid=m.pid,bl=m.blob;closeModal();openDraw(pid,bl)}break}
    case 'vDel':{if(!VW)break;if(!VW.armed){VW.armed=true;b.textContent='한 번 더 누르면 삭제';break}const id=VW.id;closeModal();await deleteMedia(id);toast('삭제했습니다');break}
    case 'dcolor':if(DR){DR.color=b.dataset.c;document.querySelectorAll('#dcol .sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}break;
    case 'dwidth':if(DR){DR.wi=+b.dataset.w;document.querySelectorAll('#dwid .wd').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}break;
    case 'dundo':if(DR){DR.strokes.pop();dRedraw()}break;
    case 'dclear':if(DR){DR.strokes=[];dRedraw()}break;
    case 'dSave':dSave();break;
    case 'close':closeModal();break;
    case 'openImport':openImport();break;
    case 'pickShp':$('#shpIn').click();break;
    case 'impGo':impGo(b);break;
    case 'openExport':openExport();break;
    case 'expGo':expGo();break;
    case 'expWipe':expWipe(b);break}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!DR&&!VW)closeModal()});

/* ================= 시작 ================= */
async function boot(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{S.vkey=localStorage.getItem('fn_vkey')||''}catch(e){}
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
  new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  new ResizeObserver(()=>resize()).observe($('#mapView'));
  try{
    const layer=await idb.get('kv','layer');
    if(layer){S.layer=prep(layer);
      (await idb.all('rec')).forEach(r=>S.recs.set(r.pid,r));
      S.layers=(await idb.all('layers')).sort((a,b)=>a.added-b.added);
      (await idb.all('media')).forEach(m=>{if(!S.media.has(m.pid))S.media.set(m.pid,[]);S.media.get(m.pid).push(m)})}
  }catch(e){S.volatile=true;$('#vol').hidden=false}
  if(!S.layer){S.layer=sampleLayer();await persist(()=>idb.put('kv',S.layer,'layer'))}
  resize();fit();refreshAll();
  if(S.layer.sample)toast('예시 데이터입니다. 위의 "shp 불러오기"로 실제 파일을 올리세요.',4200)}
window.__t={pickLine,parseLines,convertLayer,BASES,syncCad,parseShp,parseDbf,tmForward,tmInverse,CRS,S,M,openDraw,toLngLat};
boot();
</script>

<script>if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
