  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131815; --surface:#1c2320; --surface2:#27302b; --ink:#e8eee9; --muted:#9aa69d; --line:#333d36;
  --accent:#ff7d52; --accent-ink:#1a0d07; --accent-soft:#3a2219;
  --ok:#5cc489; --mark:#8eaac0; --warn:#e0a13c; --danger:#ff8a80; --gps:#6ea2ff; --canvas:#1a201d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131815; --surface:#1c2320; --surface2:#27302b; --ink:#e8eee9; --muted:#9aa69d; --line:#333d36;
  --accent:#ff7d52; --accent-ink:#1a0d07; --accent-soft:#3a2219;
  --ok:#5cc489; --mark:#8eaac0; --warn:#e0a13c; --danger:#ff8a80; --gps:#6ea2ff; --canvas:#1a201d; color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-text-size-adjust:100%;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;min-height:0}

.grab .x{margin-left:auto}

.coord{margin:4px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;font-weight:700;font-size:13px}

.sub-act{margin-top:8px}

.dlg{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.dlg h2{margin:0 0 6px;font-size:18px}
.dlg p{margin:6px 0}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-size:13px;font-weight:700}
.field select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;width:100%}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
.warn{color:var(--warn);font-size:13px}
.err{color:var(--danger);font-size:13px}
.ok-t{color:var(--ok);font-size:13px}
.pv{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.pv td,.pv th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;overflow-wrap:anywhere}
.pv-wrap{overflow-x:auto}
.chk{display:flex;gap:10px;align-items:center;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.stats{display:flex;gap:16px;margin:8px 0;font-size:13px;color:var(--muted)}
.stats b{display:block;font:500 20px var(--mono);color:var(--ink)}

.viewer{background:#0b0f0d;width:100%;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.vbar .btn{flex:1;background:#1f2723;color:#eef3ef;border-color:#33403a}
.vbar .btn.danger{color:#ff8a80;border-color:#ff8a80;background:transparent}

.draw{background:var(--surface);width:100%;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dbar{display:flex;align-items:center;justify-content:space-between;padding:6px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.dstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--surface2);overflow:hidden}
#dcv{background:#fff;touch-action:none;box-shadow:0 1px 8px rgba(0,0,0,.25)}

.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}

.grp{display:flex;gap:8px;align-items:center}

<script>
'use strict';
/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,w=2)=>String(n).padStart(w,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const safeName=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/\s+/g,' ').trim().slice(0,40)||'이름없음';
let toastT=0;
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ================= 좌표 변환 (횡메르카토르, GRS80) ================= */
const GRS={a:6378137,f:1/298.257222101};
const E2=2*GRS.f-GRS.f*GRS.f, EP2=E2/(1-E2);
const CRS={
  5186:{label:'EPSG:5186 중부원점 (Korea 2000)',lon0:127,lat0:38,k:1,x0:200000,y0:600000},
  5185:{label:'EPSG:5185 서부원점 (Korea 2000)',lon0:125,lat0:38,k:1,x0:200000,y0:600000},
  5187:{label:'EPSG:5187 동부원점 (Korea 2000)',lon0:129,lat0:38,k:1,x0:200000,y0:600000},
  5188:{label:'EPSG:5188 동해원점 (Korea 2000)',lon0:131,lat0:38,k:1,x0:200000,y0:600000},
  5179:{label:'EPSG:5179 UTM-K',lon0:127.5,lat0:38,k:0.9996,x0:1000000,y0:2000000},
  4326:{label:'EPSG:4326 경위도 (WGS84)',geo:true}
};
function meridian(phi){const e2=E2,e4=e2*e2,e6=e4*e2;
  return GRS.a*((1-e2/4-3*e4/64-5*e6/256)*phi-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*phi)+(15*e4/256+45*e6/1024)*Math.sin(4*phi)-(35*e6/3072)*Math.sin(6*phi))}
function tmForward(lng,lat,c){
  const r=Math.PI/180,phi=lat*r,dl=(lng-c.lon0)*r,s=Math.sin(phi),co=Math.cos(phi),t=Math.tan(phi);
  const N=GRS.a/Math.sqrt(1-E2*s*s),T=t*t,C=EP2*co*co,A=dl*co;
  const x=c.x0+c.k*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*EP2)*A**5/120);
  const y=c.y0+c.k*(meridian(phi)-meridian(c.lat0*r)+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*EP2)*A**6/720));
  return [x,y]}
function tmInverse(x,y,c){
  const r=Math.PI/180,e2=E2,e4=e2*e2,e6=e4*e2;
  const M=meridian(c.lat0*r)+(y-c.y0)/c.k, mu=M/(GRS.a*(1-e2/4-3*e4/64-5*e6/256));
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const s=Math.sin(p1),co=Math.cos(p1),t=Math.tan(p1);
  const C1=EP2*co*co,T1=t*t,N1=GRS.a/Math.sqrt(1-e2*s*s),R1=GRS.a*(1-e2)/Math.pow(1-e2*s*s,1.5),D=(x-c.x0)/(N1*c.k);
  const lat=p1-(N1*t/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*EP2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*EP2-3*C1*C1)*D**6/720);
  const lon=(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*EP2+24*T1*T1)*D**5/120)/co;
  return [c.lon0+lon/r,lat/r]}
function toLngLat(x,y,epsg){const c=CRS[epsg];return c.geo?[x,y]:tmInverse(x,y,c)}
function guessCrs(prj){
  if(!prj)return 5186;
  if(/UTM[-_ ]?K|Korea_2000_Unified|Unified_CS/i.test(prj))return 5179;
  if(/Korea_2000/i.test(prj)||/Korea_.*Belt_2010/i.test(prj)){
    if(/West_Belt/i.test(prj))return 5185; if(/East_Belt/i.test(prj))return 5187; if(/East_Sea/i.test(prj))return 5188; return 5186}
  if(/^\s*GEOGCS/i.test(prj)&&!/PROJCS/i.test(prj))return 4326;
  return 5186}

/* ================= shp / dbf 읽기 ================= */
function parseShp(buf){
  const dv=new DataView(buf),len=buf.byteLength;
  if(len<100||dv.getInt32(0,false)!==9994)throw new Error('올바른 .shp 파일이 아닙니다');
  const type=dv.getInt32(32,true),pts=[];let p=100;
  while(p+8<=len){
    const clen=dv.getInt32(p+4,false)*2,s=p+8;if(clen<4||s+clen>len)break;
    const t=dv.getInt32(s,true);
    if(t===1||t===11||t===21)pts.push([dv.getFloat64(s+4,true),dv.getFloat64(s+12,true)]);
    else if(t!==0&&clen>=36)pts.push([(dv.getFloat64(s+4,true)+dv.getFloat64(s+20,true))/2,(dv.getFloat64(s+12,true)+dv.getFloat64(s+28,true))/2]);
    else pts.push(null);
    p=s+clen}
  return {type,pts,approx:![1,11,21,0].includes(type)}}
function encFromCpg(cpg){
  if(!cpg)return null;const c=cpg.trim().toLowerCase();
  if(/utf-?8|65001/.test(c))return 'utf-8';
  if(/949|euc-?kr|ms949|cp949|korean/.test(c))return 'euc-kr';
  return null}
function parseDbf(buf,pref,hint){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  const n=dv.getUint32(4,true),hl=dv.getUint16(8,true),rl=dv.getUint16(10,true),fl=[];
  for(let p=32;p<hl-1&&u8[p]!==0x0D;p+=32){let e=p;while(e<p+11&&u8[e]!==0)e++;fl.push({nb:u8.subarray(p,e),len:u8[p+16]})}
  let enc=pref;
  if(!enc||enc==='auto'){
    enc=hint;
    if(!enc){try{new TextDecoder('utf-8',{fatal:true}).decode(u8.subarray(hl));enc='utf-8'}catch(e){enc='euc-kr'}}}
  const dec=new TextDecoder(enc);
  const names=[];fl.forEach(f=>{let nm=dec.decode(f.nb).trim()||'필드',b=nm,k=2;while(names.includes(nm))nm=b+'_'+k++;names.push(nm)});
  const rows=[];
  for(let r=0;r<n;r++){
    const base=hl+r*rl;if(base+rl>u8.length)break;
    const del=u8[base]===0x2A;let o=base+1;const row={};
    for(let i=0;i<fl.length;i++){row[names[i]]=dec.decode(u8.subarray(o,o+fl[i].len)).replace(/\0/g,'').trim();o+=fl[i].len}
    rows.push(del?null:row)}
  return {fields:names,rows,enc}}
function guessField(fields,re){return fields.find(f=>re.test(f))||''}
const NAME_RE=/장소|명칭|시설|이름|지점|대상|^name|_?nm$|title|poi/i, ADDR_RE=/주소|도로명|지번|addr|adr|location|소재/i;
async function gatherFiles(fileList){
  const ents=[];
  for(const f of [...fileList]){
    if(/\.zip$/i.test(f.name)){
      if(typeof JSZip==='undefined')throw new Error('ZIP 처리 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 shp·dbf·prj를 함께 선택하세요');
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      z.forEach((path,en)=>{if(!en.dir&&!/(^|\/)(__MACOSX|\._)/.test(path))ents.push({name:path.split('/').pop(),get:()=>en.async('arraybuffer')})})
    }else ents.push({name:f.name,get:()=>f.arrayBuffer()})}
  const ext=(e,x)=>e.name.toLowerCase().endsWith('.'+x);
  const shpE=ents.find(e=>ext(e,'shp'));if(!shpE)throw new Error('.shp 파일을 찾지 못했습니다');
  const base=shpE.name.slice(0,-4).toLowerCase();
  const pick=x=>ents.find(e=>ext(e,x)&&e.name.slice(0,-4).toLowerCase()===base)||ents.find(e=>ext(e,x));
  const dbfE=pick('dbf'),prjE=pick('prj'),cpgE=pick('cpg'),td=new TextDecoder();
  return {name:shpE.name.slice(0,-4),shp:await shpE.get(),dbf:dbfE?await dbfE.get():null,
    prj:prjE?td.decode(await prjE.get()):'',cpg:cpgE?td.decode(await cpgE.get()):''}}

const idb=(()=>{
  let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{try{
    const r=indexedDB.open('field-note',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('rec',{keyPath:'pid'});d.createObjectStore('media',{keyPath:'id'})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}}));
  const wrap=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  const tx=async(s,m,fn)=>{const d=await open();return wrap(fn(d.transaction(s,m).objectStore(s)))};
  return {
    get:(s,k)=>tx(s,'readonly',o=>o.get(k)),
    put:(s,v,k)=>tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)),
    del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),
    all:s=>tx(s,'readonly',o=>o.getAll()),
    clear:s=>tx(s,'readwrite',o=>o.clear())}})();

const cv=$('#map'),cx=cv.getContext('2d');
const M={cx:.5,cy:.4,z:5,w:0,h:0,dpr:1,tiles:new Map(),errs:0,oks:0,raf:0,col:{}};
const BASES={
  osm:{url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,attr:'© OpenStreetMap contributors',max:19},
  sat:{url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,attr:'Esri, Maxar, Earthstar Geographics',max:18}};
const SC=()=>256*Math.pow(2,M.z);
const sx=wx=>(wx-M.cx)*SC()+M.w/2, sy=wy=>(wy-M.cy)*SC()+M.h/2;
function readColors(){M.col={ok:cssv('--ok'),mark:cssv('--mark'),acc:cssv('--accent'),surf:cssv('--surface'),ink:cssv('--ink'),bg:cssv('--canvas'),gps:cssv('--gps'),font:cssv('--font')};requestDraw()}
function resize(){
  const r=cv.getBoundingClientRect();M.w=r.width;M.h=r.height;M.dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.max(1,Math.round(M.w*M.dpr));cv.height=Math.max(1,Math.round(M.h*M.dpr));requestDraw()}
function requestDraw(){if(!M.raf)M.raf=requestAnimationFrame(()=>{M.raf=0;draw()})}
function getTile(b,z,x,y){
  const k=b+'/'+z+'/'+x+'/'+y;let t=M.tiles.get(k);
  if(t)return t;
  t={img:new Image(),ok:false,bad:false};
  t.img.onload=()=>{t.ok=true;M.oks++;requestDraw();$('#tileNote').hidden=true};
  t.img.onerror=()=>{t.bad=true;M.errs++;if(M.oks===0&&M.errs>=4)$('#tileNote').hidden=false};

function stateColor(f){return hasData(f.i)?M.col.ok:M.col.mark}
function niceScale(){
  const mpp=40075016.686*Math.cos(M.cy>0?(Math.atan(Math.sinh(Math.PI*(1-2*M.cy)))):0)/SC();
  const steps=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000];
  for(const s of steps){if(s/mpp>=70)return {m:s,px:s/mpp}}
  return null}
function draw(){
  const w=M.w,h=M.h;if(!w||!h)return;
  const c=cx;c.setTransform(M.dpr,0,0,M.dpr,0,0);c.fillStyle=M.col.bg||'#e6e8e1';c.fillRect(0,0,w,h);
  const base=BASES[S.base],tz=Math.max(0,Math.min(base.max,Math.round(M.z))),n=Math.pow(2,tz),ts=SC()/n;
  const x0=Math.floor((M.cx-w/2/SC())*n),x1=Math.floor((M.cx+w/2/SC())*n),y0=Math.max(0,Math.floor((M.cy-h/2/SC())*n)),y1=Math.min(n-1,Math.floor((M.cy+h/2/SC())*n));
  if((x1-x0+1)*(y1-y0+1)<=80){
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const t=getTile(S.base,tz,((tx%n)+n)%n,ty);
      if(t.ok)c.drawImage(t.img,sx(tx/n),sy(ty/n),ts+.6,ts+.6)}}

      if(showLabel){c.lineWidth=3.5;c.strokeStyle=M.col.surf;c.strokeText(f.name,x+13,y);c.fillStyle=M.col.ink;c.fillText(f.name,x+13,y)}}

      c.lineWidth=3.5;c.strokeStyle=M.col.surf;c.strokeText(selF.name,x+16,y);c.fillStyle=M.col.ink;c.fillText(selF.name,x+16,y)}}

    c.lineWidth=2;c.strokeStyle=M.col.ink;c.beginPath();c.moveTo(bx,by-4);c.lineTo(bx,by);c.lineTo(bx+sc.px,by);c.lineTo(bx+sc.px,by-4);c.stroke();

  if(M.oks>0){const at=base.attr;c.textAlign='right';c.lineWidth=3;c.strokeStyle=M.col.surf;c.strokeText(at,w-8,h-8);c.fillStyle=M.col.ink;c.fillText(at,w-8,h-8);c.textAlign='left'}}
function zoomAt(px,py,nz){

function fit(){
  const L=S.layer;if(!L||!L.features.length)return;
  let a=1,b=0,c=1,d=0;L.features.forEach(f=>{a=Math.min(a,f.wx);b=Math.max(b,f.wx);c=Math.min(c,f.wy);d=Math.max(d,f.wy)});

/* 포인터 제스처 */
const P=new Map();let tap=null,pinch=null;
const rel=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=rel(e);P.set(e.pointerId,p);
  if(P.size===1)tap={x:p.x,y:p.y,t:Date.now(),moved:false};
  else{tap=null;const [a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}});
cv.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId))return;const p=rel(e),o=P.get(e.pointerId);P.set(e.pointerId,p);
  if(P.size===1){
    M.cx-=(p.x-o.x)/SC();M.cy-=(p.y-o.y)/SC();requestDraw();
    if(tap&&Math.hypot(p.x-tap.x,p.y-tap.y)>8)tap.moved=true}
  else if(P.size===2&&pinch){
    const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    M.cx-=(mx-pinch.mx)/SC();M.cy-=(my-pinch.my)/SC();
    if(d>0&&pinch.d>0)zoomAt(mx,my,M.z+Math.log2(d/pinch.d));
    pinch={d,mx,my}}});
function endPtr(e){
  const had=P.has(e.pointerId);P.delete(e.pointerId);if(!had)return;
  if(P.size<2)pinch=null;
  if(tap&&!tap.moved&&e.type==='pointerup'&&Date.now()-tap.t<600)hitTest(tap.x,tap.y);
  if(P.size===0)tap=null}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();const p=rel(e);zoomAt(p.x,p.y,M.z-e.deltaY*.0015)},{passive:false});
function hitTest(px,py){
  const L=S.layer;if(!L)return;let best=null,bd=26;
  for(const f of L.features){const d=Math.hypot(sx(f.wx)-px,sy(f.wy)-py);if(d<bd){bd=d;best=f}}
  if(best)select(best.i,true);else deselect()}

async function shrink(file,max=2048,q=.85){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();
  return new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',q))}
async function addMedia(pid,kind,blob){
  const m={id:uid(),pid,kind,blob,ts:Date.now()};
  if(!S.media.has(pid))S.media.set(pid,[]);S.media.get(pid).push(m);

function fitDraw(){
  if(!DR)return;const st=$('#dstage'),cvd=$('#dcv');if(!st||!cvd)return;
  const s=Math.min((st.clientWidth-16)/DR.W,(st.clientHeight-16)/DR.H);cvd.style.width=Math.floor(DR.W*s)+'px';cvd.style.height=Math.floor(DR.H*s)+'px'}
window.addEventListener('resize',()=>{fitDraw();resize()});
function pw(){return [4,9,18][DR.wi-1]*(DR.W/1200)}
function dStroke(c,s,from){
  c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.w;c.lineCap='round';c.lineJoin='round';
  if(s.pts.length===1){c.beginPath();c.arc(s.pts[0][0],s.pts[0][1],s.w/2,0,7);c.fill();return}
  c.beginPath();c.moveTo(...s.pts[from||0]);for(let i=(from||0)+1;i<s.pts.length;i++)c.lineTo(...s.pts[i]);c.stroke()}
function dRedraw(){
  const cvd=$('#dcv');if(!cvd||!DR)return;const c=cvd.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,DR.W,DR.H);if(DR.bmp)c.drawImage(DR.bmp,0,0,DR.W,DR.H);
  DR.strokes.forEach(s=>dStroke(c,s))}
function bindDraw(){
  const cvd=$('#dcv');
  const pos=e=>{const r=cvd.getBoundingClientRect();return [(e.clientX-r.left)*DR.W/r.width,(e.clientY-r.top)*DR.H/r.height]};
  cvd.addEventListener('pointerdown',e=>{if(!DR)return;e.preventDefault();cvd.setPointerCapture(e.pointerId);DR.cur={color:DR.color,w:pw(),pts:[pos(e)]};DR.strokes.push(DR.cur);dStroke(cvd.getContext('2d'),DR.cur)});
  cvd.addEventListener('pointermove',e=>{if(!DR||!DR.cur)return;const s=DR.cur,n=s.pts.length;s.pts.push(pos(e));dStroke(cvd.getContext('2d'),s,Math.max(0,n-1))});
  const up=()=>{if(DR)DR.cur=null};cvd.addEventListener('pointerup',up);cvd.addEventListener('pointercancel',up)}

let wipeArmed=false;
async function expWipe(btn){
  if(!wipeArmed){wipeArmed=true;btn.textContent='정말 지웁니다 (한 번 더 누르세요)';setTimeout(()=>{wipeArmed=false;if(btn.isConnected)btn.textContent='모든 기록 지우기'},4000);return}
  wipeArmed=false;await wipeAll();closeModal();refreshAll();toast('기록을 모두 지웠습니다')}

/* ================= 내 위치 ================= */
function locate(){
  if(!navigator.geolocation){toast('이 기기에서는 위치를 쓸 수 없습니다');return}
  const ok=p=>{S.loc={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||30};requestDraw();if(S.tab==='list')renderList()};
  navigator.geolocation.getCurrentPosition(p=>{
    ok(p);const wx=(S.loc.lng+180)/360,s=Math.sin(S.loc.lat*Math.PI/180);M.cx=wx;M.cy=0.5-Math.log((1+s)/(1-s))/(4*Math.PI);M.z=Math.max(M.z,16);requestDraw();
    if(!S.watch)S.watch=navigator.geolocation.watchPosition(ok,()=>{},{enableHighAccuracy:true,maximumAge:5000})},
    ()=>toast('위치를 가져오지 못했습니다. 위치 권한을 허용했는지 확인하세요. 미리보기 화면에서는 막혀 있을 수 있습니다.',4200),
    {enableHighAccuracy:true,timeout:12000})}

/* ================= 클릭 처리 ================= */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
    case 'tab':setTab(b.dataset.tab);break;
    case 'zin':zoomAt(M.w/2,M.h/2,M.z+1);break;
    case 'zout':zoomAt(M.w/2,M.h/2,M.z-1);break;
    case 'fit':fit();break;
    case 'locate':locate();break;
    case 'basemap':S.base=S.base==='osm'?'sat':'osm';b.textContent=S.base==='osm'?'위성':'지도';requestDraw();break;
    case 'pick':setTab('map');select(+b.dataset.i,true);break;
    case 'deselect':deselect();break;
    case 'sheetMin':{const sh=$('#sheet');sh.classList.toggle('min');b.textContent=sh.classList.contains('min')?'펼치기':'접기';break}
    case 'copyAddr':{const f=featureOf(S.sel);try{await navigator.clipboard.writeText(f.addr);toast('주소를 복사했습니다')}catch(err){toast('복사하지 못했습니다. 주소를 길게 눌러 복사하세요')}break}
    case 'shoot':if(S.sel!=null)$('#camIn').click();break;
    case 'gallery':if(S.sel!=null)$('#galIn').click();break;
    case 'drawNew':if(S.sel!=null){saveMemoNow();openDraw(S.sel,null)}break;
    case 'view':openViewer(b.dataset.id);break;
    case 'vDraw':{const m=VW&&findMedia(VW.id);if(m){const pid=m.pid,bl=m.blob;closeModal();openDraw(pid,bl)}break}
    case 'vDel':{if(!VW)break;if(!VW.armed){VW.armed=true;b.textContent='한 번 더 누르면 삭제';break}const id=VW.id;closeModal();await deleteMedia(id);toast('삭제했습니다');break}
    case 'dcolor':if(DR){DR.color=b.dataset.c;document.querySelectorAll('#dcol .sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}break;
    case 'dwidth':if(DR){DR.wi=+b.dataset.w;document.querySelectorAll('#dwid .wd').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}break;
    case 'dundo':if(DR){DR.strokes.pop();dRedraw()}break;
    case 'dclear':if(DR){DR.strokes=[];dRedraw()}break;
    case 'dSave':dSave();break;
    case 'close':closeModal();break;
    case 'openImport':openImport();break;
    case 'pickShp':$('#shpIn').click();break;
    case 'impGo':impGo(b);break;
    case 'openExport':openExport();break;
    case 'expGo':expGo();break;
    case 'expWipe':expWipe(b);break}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!DR&&!VW)closeModal()});

/* ================= 시작 ================= */
async function boot(){
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
  new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  new ResizeObserver(()=>resize()).observe($('#mapView'));
  try{
    const layer=await idb.get('kv','layer');
    if(layer){S.layer=prep(layer);
      (await idb.all('rec')).forEach(r=>S.recs.set(r.pid,r));
      (await idb.all('media')).forEach(m=>{if(!S.media.has(m.pid))S.media.set(m.pid,[]);S.media.get(m.pid).push(m)})}
  }catch(e){S.volatile=true;$('#vol').hidden=false}
  if(!S.layer){S.layer=sampleLayer();await persist(()=>idb.put('kv',S.layer,'layer'))}
  resize();fit();refreshAll();
  if(S.layer.sample)toast('예시 데이터입니다. 위의 "shp 불러오기"로 실제 파일을 올리세요.',4200)}
window.__t={parseShp,parseDbf,tmForward,tmInverse,CRS,S,M,openDraw,toLngLat};
boot();
</script>
